<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Panel</title>
<link rel="stylesheet" href="/api/admin/assets/panel.css">
<script src="/api/admin/assets/panel.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const api = makeApi('jeweller_token');
const S = {
  tab: localStorage.getItem('jp_tab') || 'dashboard', me: null, tenant: null, price: null,
  dash: null, dr: { range: '1d' }, orders: null, of: { side: 'all', metal: 'all', status: 'all', search: '' },
  hold: null, hsearch: '', customers: null, csearch: '', kyc: null, pickups: null, lookup: null,
  products: null, gifts: null, refs: null, settings: null, revealKey: false,
  comm: { gold: 0, silver: 0, dirty: false },
};
const NAV = [
  ['Overview', [['dashboard', 'Dashboard', 'dashboard'], ['commission', 'Commission', 'commission'], ['orders', 'Orders', 'orders'], ['holdings', 'Wallet & Holdings', 'wallet']]],
  ['Customers', [['customers', 'Customers', 'customers'], ['kyc', 'KYC', 'kyc'], ['redemptions', 'Redemptions', 'redeem']]],
  ['Store', [['catalogue', 'Catalogue', 'catalogue'], ['gifts', 'Gifts', 'gifts'], ['referral', 'Referral', 'referral'], ['settings', 'Settings', 'settings']]],
];
const TITLES = Object.fromEntries(NAV.flatMap(([, items]) => items.map(([k, l]) => [k, l])));

/* ── auth ─────────────────────────────── */
function loginView() {
  const t = S.tenant;
  return `<div class="auth">
    <div class="auth-art">
      <div class="brand" style="padding:0;border:0"><div class="logo"><div class="mark">${t?.logo_url ? `<img src="${esc(t.logo_url)}">` : 'V'}</div>
        <div><div class="name" style="color:#fff">${esc(t?.business_name || 'Vaultra')}</div><div class="sub" style="color:#B9AF95">Shop Panel</div></div></div></div>
      <div><h1>Run your <em>digital gold</em> counter from one place.</h1>
        <p>Track bookings, set your commission on the live rate, approve KYC and hand over redemptions — all in real time.</p></div>
      <div class="stats"><div><b>24K</b><span>99.9% pure</span></div><div><b>999</b><span>fine silver</span></div><div><b>Live</b><span>market rates</span></div></div>
    </div>
    <div class="auth-form"><form class="auth-box" onsubmit="doLogin(event)">
      <h2>Welcome back</h2><p>Sign in to manage your store</p>
      <div class="field"><label>Email</label><input class="input" id="le" type="email" autocomplete="username" required placeholder="you@store.com"></div>
      <div class="field"><label>Password</label><input class="input" id="lp" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn primary" id="login-btn" type="submit">Sign in</button>
      <div class="err" id="lerr"></div>
    </form></div></div>`;
}
async function doLogin(e) {
  e.preventDefault();
  const b = $('#login-btn'); b.disabled = true; b.textContent = 'Signing in…';
  try {
    const r = await api('/jeweller/login', { method: 'POST', body: { email: $('#le').value.trim(), password: $('#lp').value } });
    if (S.tenant && r.jeweller.id !== S.tenant.id) throw new Error('This account does not belong to ' + S.tenant.business_name);
    localStorage.setItem('jeweller_token', r.access_token);
    S.me = r.jeweller; boot();
  } catch (err) { $('#lerr').textContent = err.message; b.disabled = false; b.textContent = 'Sign in'; }
}
function logout() { localStorage.removeItem('jeweller_token'); S.me = null; render(); }

/* ── shell ────────────────────────────── */
function shell(content) {
  const j = S.me || {};
  const badge = { kyc: S.dash?.pending?.kyc, redemptions: S.dash?.pending?.pickups };
  return `<div class="app">
    <aside class="side" id="side">
      <div class="brand"><div class="logo"><div class="mark">${j.logo_url ? `<img src="${esc(j.logo_url)}">` : esc(initials(j.business_name).slice(0, 1))}</div>
        <div style="min-width:0"><div class="name">${esc(j.business_name || '')}</div><div class="sub">Shop Panel</div></div></div></div>
      <nav class="nav">${NAV.map(([g, items]) => `<div class="group">${g}</div>${items.map(([k, l, ic]) =>
        `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')" data-tab="${k}">${icon(ic)}<span>${l}</span>${badge[k] ? `<span class="count">${badge[k]}</span>` : ''}</button>`).join('')}`).join('')}</nav>
      <div class="side-foot"><div class="avatar">${esc(initials(j.owner_name))}</div>
        <div class="who"><b>${esc(j.owner_name || '')}</b><span>Owner</span></div>
        <button class="btn ghost sm" title="Sign out" onclick="logout()" id="logout-btn">${icon('logout')}</button></div>
    </aside>
    <main class="main">
      <div class="top"><button class="btn ghost sm menu-btn" onclick="$('#side').classList.toggle('open')">${icon('menu')}</button>
        <h1>${TITLES[S.tab]}</h1><div class="spacer"></div>${rateChip(S.price)}</div>
      <div class="content" id="content">${content}</div>
    </main></div>`;
}
function render() {
  if (!localStorage.getItem('jeweller_token') || !S.me) { $('#root').innerHTML = loginView(); return; }
  $('#root').innerHTML = shell(VIEWS[S.tab]());
}
function go(tab) { S.tab = tab; localStorage.setItem('jp_tab', tab); $('#side')?.classList.remove('open'); render(); LOAD[tab]?.(); }
const loading = '<div class="grid g4"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
const kpi = (label, value, foot, ic, tone = '', id = '') => `<div class="card kpi" ${id ? `id="${id}"` : ''}><div class="icon ${tone}">${icon(ic)}</div><div class="label">${label}</div><div class="value num">${value}</div>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
const emptyRow = (cols, t, s = '') => `<tr><td colspan="${cols}"><div class="empty"><b>${t}</b>${s}</div></td></tr>`;

/* ── dashboard ────────────────────────── */
function rangeQS(r) { return r.range === 'custom' ? `range=custom&start=${r.from || ''}&end=${r.to || ''}` : `range=${r.range}`; }
async function loadDash() {
  try { S.dash = await api('/jeweller/v3/dashboard?' + rangeQS(S.dr)); S.price = S.dash.price; } catch (e) { toast(e.message, true); }
  if (S.tab === 'dashboard') render();
}
function onDashRange(k, apply) {
  if (k === 'custom' && apply) { S.dr.from = $('#r_from').value; S.dr.to = $('#r_to').value; if (!S.dr.from) return toast('Choose a start date', true); }
  S.dr.range = k;
  if (k !== 'custom' || apply) { S.dash = null; render(); loadDash(); } else render();
}
const rangeLabel = (r) => ({ '1d': 'today', '3d': 'last 3 days', '7d': 'last 7 days', '30d': 'last 30 days', custom: 'selected dates' }[r.range]);
function vDashboard() {
  const d = S.dash;
  const head = `<div class="page-head"><div><h2>Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 17 ? 'afternoon' : 'evening'}, ${esc((S.me.owner_name || '').split(' ')[0])}</h2>
    <p>Here is how your store is doing ${rangeLabel(S.dr)}.</p></div>${rangeBar(S.dr, onDashRange)}</div>`;
  if (!d) return head + loading;
  const b = d.booked, c = d.customers;
  return head + `
  <div class="grid g4">
    ${kpi('Gold booked', g4(b.gold_g), inr0(b.gold_amt) + ' collected', 'coin', '', 'kpi-gold-booked')}
    ${kpi('Silver booked', g4(b.silver_g), inr0(b.silver_amt) + ' collected', 'coin', 'gray', 'kpi-silver-booked')}
    ${kpi('Orders', b.orders, `${b.redemptions} redemptions · ${g4(b.redeemed_g)}`, 'orders', 'blue')}
    ${kpi('Total sales', inr0(b.gold_amt + b.silver_amt), `GST ${inr0(b.gst)}`, 'trend', 'green')}
  </div>
  <div class="grid g4 section">
    ${kpi('Total customers', c.total, `${c.new} new ${rangeLabel(S.dr)}`, 'customers')}
    ${kpi('Active customers', c.active, 'transacted ' + rangeLabel(S.dr), 'users', 'green', 'kpi-active')}
    ${kpi('Inactive customers', c.inactive, 'no activity ' + rangeLabel(S.dr), 'usersOff', 'gray', 'kpi-inactive')}
    ${kpi('Gold in customer vaults', g4(d.holdings.gold_g), `Silver ${g4(d.holdings.silver_g)}`, 'wallet')}
  </div>
  <div class="grid section" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
    <div class="card"><div class="card-h"><div><h3>Daily bookings</h3><p>Amount collected per day</p></div></div>${barChart(d.series, 'amount', inr0)}<div style="height:16px"></div></div>
    <div class="card"><div class="card-h"><h3>Needs attention</h3></div><div class="list">
      <div class="item"><div class="avatar" style="background:var(--amberbg);color:var(--amber);border-color:#FEDF89">${icon('redeem')}</div><div class="grow"><div class="t">${d.pending.pickups} pickups waiting</div><div class="s">Customers coming to collect coins</div></div><button class="btn sm" onclick="go('redemptions')">Open</button></div>
      <div class="item"><div class="avatar" style="background:var(--bluebg);color:var(--blue);border-color:#C7D7FE">${icon('kyc')}</div><div class="grow"><div class="t">${d.pending.kyc} KYC to review</div><div class="s">Approve to unlock redemption</div></div><button class="btn sm" onclick="go('kyc')">Review</button></div>
      <div class="item"><div class="avatar">${icon('commission')}</div><div class="grow"><div class="t">Gold buy rate ${inr(d.price.buy)}/g</div><div class="s">Live ${inr(d.price.base_rate)} + your commission</div></div><button class="btn sm" onclick="go('commission')">Edit</button></div>
    </div></div>
  </div>
  <div class="card section"><div class="card-h"><h3>Latest orders</h3><button class="btn sm" onclick="go('orders')">View all</button></div>
    <div class="table-wrap"><table><thead><tr><th>When</th><th>Customer</th><th>Type</th><th>Metal</th><th class="r">Quantity</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
    ${d.recent.length ? d.recent.map((o) => `<tr><td>${dt(o.created_at)}</td><td><b>${esc(o.customer_name)}</b><div class="sub">${phoneFmt(o.phone)}</div></td>
      <td>${o.side === 'buy' ? '<span class="badge green plain">Buy</span>' : '<span class="badge amber plain">Redeem</span>'}</td><td>${metalTag(o.metal)}</td>
      <td class="r num">${g4(o.grams)}</td><td class="r num"><b>${inr(o.total)}</b></td><td>${statusBadge(o.status)}</td></tr>`).join('') : emptyRow(7, 'No orders yet')}
    </tbody></table></div></div>`;
}

/* ── commission ───────────────────────── */
function vCommission() {
  const p = S.price;
  if (!p || !S.me) return loading;
  const card = (metal, base, val, max) => {
    const buy = Number(base || 0) + Number(val || 0);
    return `<div class="card pad">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div class="rate-card" style="padding:0"><div class="coin ${metal === 'silver' ? 'silver' : ''}" style="width:36px;height:36px"></div></div>
        <div><h3 style="font-size:16px">${metal === 'gold' ? 'Gold · 24K 99.9%' : 'Silver · 999'}</h3><div style="font-size:12px;color:var(--mute)">Commission added on every gram your customers buy</div></div></div>
      <div class="field"><label>Your commission per gram</label>
        <div class="prefix"><span>₹</span><input class="input lg num" id="c_${metal}" type="number" min="0" max="${max}" step="0.01" value="${val}" oninput="commInput('${metal}', this.value)"></div>
        <div class="hint">Flat amount in rupees per gram · up to ₹${max.toLocaleString('en-IN')}</div></div>
      <div class="calc">
        <div class="row"><span>Live ${metal} rate</span><span class="num" id="cl_${metal}">${inr(base)}</span></div>
        <div class="row"><span>+ Your commission</span><span class="num" id="cc_${metal}">${inr(val || 0)}</span></div>
        <div class="row total"><span>Customer buy rate</span><span class="v num" id="cb_${metal}">${inr(buy)}/g</span></div>
      </div></div>`;
  };
  return `<div class="page-head"><div><h2>Commission</h2><p>Set a flat rupee amount per gram on top of the live rate. Changes reach the customer app instantly.</p></div></div>
    <div class="grid g2">
      <div class="card rate-card"><div class="coin"></div><div style="flex:1"><div class="label"><span class="dot ${p.live ? 'live' : ''}"></span> Live gold rate</div>
        <div class="value num" id="live-gold">${inr(p.base_rate)} <small>/g</small></div></div><div class="chg ${p.change_pct >= 0 ? 'up' : 'down'}">${p.change_pct >= 0 ? '▲' : '▼'} ${Math.abs(p.change_pct)}%</div></div>
      <div class="card rate-card"><div class="coin silver"></div><div style="flex:1"><div class="label"><span class="dot ${p.live ? 'live' : ''}"></span> Live silver rate</div>
        <div class="value num" id="live-silver">${inr(p.silver?.base_rate)} <small>/g</small></div></div><div class="chg ${(p.silver?.change_pct || 0) >= 0 ? 'up' : 'down'}">${(p.silver?.change_pct || 0) >= 0 ? '▲' : '▼'} ${Math.abs(p.silver?.change_pct || 0)}%</div></div>
    </div>
    <div class="grid g2 section">${card('gold', p.base_rate, S.comm.gold, 1000)}${card('silver', p.silver?.base_rate, S.comm.silver, 100)}</div>
    <div class="section" style="display:flex;align-items:center;gap:14px">
      <button class="btn gold" id="save-commission" onclick="saveComm()" style="height:44px;padding:0 22px">Save commission</button>
      <span style="font-size:12px;color:var(--mute)" id="comm-status">${S.comm.dirty ? 'Unsaved changes' : (S.me.commission_updated_at ? 'Last updated ' + dt(S.me.commission_updated_at) : '')}</span>
    </div>
    <div class="note gray section">${icon('rate')}<span>${p.live ? 'Rates update every few seconds from the market feed.' : 'Market feed is not connected yet — showing indicative rates. Customer prices will follow the live rate as soon as it connects.'}</span></div>`;
}
function commInput(metal, v) {
  S.comm[metal] = v; S.comm.dirty = true;
  const base = metal === 'gold' ? S.price.base_rate : S.price.silver.base_rate;
  $('#cc_' + metal).textContent = inr(Number(v || 0));
  $('#cb_' + metal).textContent = inr(Number(base) + Number(v || 0)) + '/g';
  $('#comm-status').textContent = 'Unsaved changes';
}
async function saveComm() {
  const b = $('#save-commission'); b.disabled = true;
  try {
    const r = await api('/jeweller/v3/commission', { method: 'PUT', body: { gold_per_g: Number(S.comm.gold || 0), silver_per_g: Number(S.comm.silver || 0) } });
    S.price = r.price; delete r.price; S.me = { ...S.me, ...r, commission_updated_at: new Date().toISOString() }; S.comm.dirty = false;
    toast(`Saved · customers now pay ${inr(S.price.buy)}/g for gold`); render();
  } catch (e) { toast(e.message, true); b.disabled = false; }
}
function syncComm() { if (!S.comm.dirty && S.me) { S.comm.gold = S.me.gold_commission_per_g || 0; S.comm.silver = S.me.silver_commission_per_g || 0; } }
function refreshLiveRates() {
  if (S.tab !== 'commission' || !S.price) return;
  const set = (id, v) => { const el = $(id); if (el) el.innerHTML = `${inr(v)} <small>/g</small>`; };
  set('#live-gold', S.price.base_rate); set('#live-silver', S.price.silver?.base_rate);
  ['gold', 'silver'].forEach((m) => { const base = m === 'gold' ? S.price.base_rate : S.price.silver.base_rate; const l = $('#cl_' + m), cb = $('#cb_' + m);
    if (l) l.textContent = inr(base); if (cb) cb.textContent = inr(Number(base) + Number(S.comm[m] || 0)) + '/g'; });
}

/* ── orders ───────────────────────────── */
async function loadOrders() {
  const f = S.of;
  try { S.orders = await api(`/jeweller/v3/orders?side=${f.side}&metal=${f.metal}&status=${f.status}&search=${encodeURIComponent(f.search)}`); } catch (e) { toast(e.message, true); }
  if (S.tab === 'orders') render();
}
let oTimer;
function setOF(k, v) { S.of[k] = v; clearTimeout(oTimer); oTimer = setTimeout(loadOrders, k === 'search' ? 300 : 0); }
function vOrders() {
  const o = S.orders, f = S.of;
  const head = `<div class="page-head"><div><h2>Orders</h2><p>Every purchase and redemption made by your customers.</p></div></div>`;
  if (!o) return head + loading;
  const s = o.summary;
  return head + `<div class="grid g4">
      ${kpi('Purchases', s.buys, inr0(s.buy_amount) + ' collected', 'orders', 'green')}
      ${kpi('Gold booked', g4(s.gold_g), '24K 99.9%', 'coin')}
      ${kpi('Silver booked', g4(s.silver_g), '999 fine', 'coin', 'gray')}
      ${kpi('Redemptions', s.redeems, g4(s.redeemed_g) + ' handed over', 'redeem', 'blue')}
    </div>
    <div class="card section"><div class="card-h"><div class="toolbar">
        <div class="seg">${[['all', 'All'], ['buy', 'Buy'], ['redeem', 'Redeem']].map(([k, l]) => `<button class="${f.side === k ? 'on' : ''}" onclick="setOF('side','${k}')" data-side="${k}">${l}</button>`).join('')}</div>
        <select class="select" onchange="setOF('metal',this.value)"><option value="all">All metals</option><option value="gold" ${f.metal === 'gold' ? 'selected' : ''}>Gold</option><option value="silver" ${f.metal === 'silver' ? 'selected' : ''}>Silver</option></select>
        <select class="select" onchange="setOF('status',this.value)"><option value="all">Any status</option>${['completed', 'processing', 'failed'].map((x) => `<option ${f.status === x ? 'selected' : ''} value="${x}">${x[0].toUpperCase() + x.slice(1)}</option>`).join('')}</select>
      </div><input class="input search" placeholder="Name, phone or invoice" value="${esc(f.search)}" oninput="setOF('search',this.value)" id="orders-search"></div>
      <div class="table-wrap"><table><thead><tr><th>When</th><th>Customer</th><th>Type</th><th>Metal</th><th class="r">Quantity</th><th class="r">Rate</th><th class="r">Total</th><th>Status</th><th></th></tr></thead><tbody>
      ${o.orders.length ? o.orders.map((x) => `<tr><td>${dt(x.created_at)}<div class="sub">${esc(x.invoice_no)}</div></td>
        <td><b>${esc(x.customer_name)}</b><div class="sub">${phoneFmt(x.phone)}</div></td>
        <td>${x.side === 'buy' ? `<span class="badge green plain">${x.type === 'sip' ? 'SIP buy' : 'Buy'}</span>` : '<span class="badge amber plain">Redeem</span>'}</td>
        <td>${metalTag(x.metal)}</td><td class="r num">${g4(x.grams)}</td><td class="r num">${inr(x.rate)}</td><td class="r num"><b>${inr(x.total)}</b></td>
        <td>${statusBadge(x.status)}</td><td class="r"><button class="btn sm" onclick="viewBill('${x.id}')" data-bill="${x.id}">${icon('invoice')} View bill</button></td></tr>`).join('') : emptyRow(9, 'No orders match these filters')}
      </tbody></table></div></div>`;
}
async function viewBill(id) {
  try {
    const b = await api(`/jeweller/v3/orders/${id}/bill`); const o = b.order, c = b.customer;
    const isR = o.side === 'redeem';
    openModal(`<div class="modal-h"><div><h3>${isR ? 'Redemption receipt' : 'Tax invoice'}</h3><p>${esc(o.invoice_no)} · ${dt(o.created_at)}</p></div><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-b" id="bill"><div class="bill">
        <div class="bill-top"><div><div class="shop">${esc(b.shop.name)}</div><div class="meta">${esc([b.shop.address, b.shop.city].filter(Boolean).join(', '))}</div><div class="meta">${phoneFmt(b.shop.phone)}</div></div><div style="text-align:right">${statusBadge(o.status)}<div class="meta" style="margin-top:6px">${o.method === 'in_store' ? 'In store' : esc((o.method || '').toUpperCase())}</div></div></div>
        <div class="bill-sec"><h4>Customer</h4><div class="kv"><span>Name</span><b>${esc(c.name)}</b></div><div class="kv"><span>Phone</span><b>${phoneFmt(c.phone)}</b></div><div class="kv"><span>Wallet ID</span><b>${esc(c.wallet_id)}</b></div>${c.email ? `<div class="kv"><span>Email</span><b>${esc(c.email)}</b></div>` : ''}<div class="kv"><span>KYC</span><b>${statusBadge(c.kyc_status)}</b></div></div>
        <div class="bill-sec"><h4>${isR ? 'Redeemed' : 'Purchased'}</h4><div class="kv"><span>Item</span><b>${esc(o.item)}</b></div><div class="kv"><span>Metal</span><b>${metalTag(o.metal)}</b></div><div class="kv"><span>Quantity</span><b class="num">${g4(o.grams)}</b></div><div class="kv"><span>Rate</span><b class="num">${inr(o.rate)}/g</b></div></div>
        <div class="bill-sec"><h4>Amount</h4><div class="kv"><span>${isR ? 'Metal value' : 'Metal amount'}</span><b class="num">${inr(o.amount)}</b></div><div class="kv"><span>${isR ? 'Making charges' : 'Charges'}</span><b class="num">${inr(o.charges)}</b></div><div class="kv"><span>GST</span><b class="num">${inr(isR ? 0 : o.gst)}</b></div></div>
        <div class="bill-total"><span>${isR ? 'Paid at store' : 'Total paid'}</span><span class="num">${inr(isR ? o.charges : o.total)}</span></div>
      </div></div>
      <div class="modal-f"><button class="btn" onclick="printBill()">${icon('print')} Print</button><button class="btn primary" onclick="closeModal()">Done</button></div>`);
  } catch (e) { toast(e.message, true); }
}
function printBill() {
  const w = window.open('', '_blank', 'width=640,height=800');
  w.document.write(`<html><head><title>Invoice</title><link rel="stylesheet" href="/api/admin/assets/panel.css"></head><body style="background:#fff;padding:24px">${$('#bill').innerHTML}</body></html>`);
  w.document.close(); setTimeout(() => w.print(), 400);
}

/* ── holdings ─────────────────────────── */
async function loadHold() { try { S.hold = await api('/jeweller/v3/holdings?search=' + encodeURIComponent(S.hsearch)); } catch (e) { toast(e.message, true); } if (S.tab === 'holdings') render(); }
let hTimer;
function vHoldings() {
  const h = S.hold;
  const head = `<div class="page-head"><div><h2>Wallet & Holdings</h2><p>How much metal each customer holds with you. Click a customer to see their full history.</p></div></div>`;
  if (!h) return head + loading;
  const t = h.totals;
  return head + `<div class="grid g4">
      ${kpi('Gold held', g4(t.gold_g), `${t.customers} customers`, 'coin')}
      ${kpi('Silver held', g4(t.silver_g), '999 fine', 'coin', 'gray')}
      ${kpi('Value at your rate', inr0(t.value), 'gold + silver', 'wallet', 'green')}

      <div class="field" style="flex:1"><label>Minimum grams</label><input class="input" type="number" step="0.1" min="0.1" id="minr" value="${s.min_redemption_grams}"></div><button class="btn primary" onclick="saveMin()" id="save-min">Save</button></div></div>
    <div class="card"><div class="card-h"><div><h3>Domains</h3><p>Managed by Vaultra support</p></div>${icon('globe')}</div><div style="padding:8px 20px 16px">
      <div class="kv"><span>Customer app</span><b>${esc(s.domain || 'Not set')}</b></div><div class="kv"><span>Shop panel</span><b>${esc(s.admin_domain || 'Not set')}</b></div></div></div>
  </div>`;
}
async function saveMin() { try { await api('/jeweller/settings/min-redemption', { method: 'PUT', body: { min_grams: Number($('#minr').value) } }); toast('Saved'); S.me.min_redemption_grams = Number($('#minr').value); loadSettings(); } catch (e) { toast(e.message, true); } }

const VIEWS = { dashboard: vDashboard, commission: () => { syncComm(); return vCommission(); }, orders: vOrders, holdings: vHoldings, customers: vCustomers, kyc: vKyc, redemptions: vRedemptions, catalogue: vCatalogue, gifts: vGifts, referral: vReferral, settings: vSettings };
const LOAD = { dashboard: loadDash, commission: loadDash, orders: loadOrders, holdings: loadHold, customers: loadCustomers, kyc: loadKyc, redemptions: loadPickups, catalogue: loadProducts, gifts: loadGifts, referral: loadRefs, settings: loadSettings };

async function boot() {
  try { if (!S.me) S.me = await api('/jeweller/me'); } catch (e) { localStorage.removeItem('jeweller_token'); render(); return; }
  document.title = `${S.me.business_name} · Shop Panel`;
  if (!VIEWS[S.tab]) S.tab = 'dashboard';
  render(); LOAD[S.tab]?.(); if (S.tab !== 'dashboard') loadDash();
}
setInterval(async () => {
  if (!S.me) return;
  try { S.price = await api('/price?jeweller_id=' + S.me.id); const chip = $('#ratechip'); if (chip) chip.outerHTML = rateChip(S.price); refreshLiveRates(); } catch {}
}, 5000);
(async () => {
  try { const r = await fetch(`${API}/tenant/resolve?host=${encodeURIComponent(location.hostname)}`); if (r.ok) { S.tenant = (await r.json()).jeweller; document.title = S.tenant.business_name + ' · Shop Panel'; } } catch {}
  if (localStorage.getItem('jeweller_token')) boot(); else render();
})();
</script>
</body>
</html>
