<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultra Master Admin</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        body { background:#0F172A; color:#F1F5F9; min-height:100vh; }
        .header { background:#1E293B; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
        .header h1 { color:#D4AF37; font-size:20px; }
        .header .logout { color:#94A3B8; cursor:pointer; padding:8px 16px; border:1px solid #334155; border-radius:8px; background:transparent; }
        .header .logout:hover { background:#334155; }
        .nav { background:#1E293B; padding:12px 24px; display:flex; gap:8px; border-bottom:1px solid #334155; flex-wrap:wrap; }
        .nav button { padding:8px 16px; border-radius:8px; border:1px solid #334155; background:transparent; color:#94A3B8; cursor:pointer; font-size:13px; }
        .nav button.active { background:#D4AF37; color:#111; border-color:#D4AF37; font-weight:600; }
        .content { padding:24px; max-width:1200px; margin:0 auto; }
        .login-wrap { display:flex; justify-content:center; align-items:center; min-height:80vh; }
        .login-box { background:#1E293B; border:1px solid #334155; border-radius:16px; padding:40px; width:380px; text-align:center; }
        .login-box h2 { color:#D4AF37; margin-bottom:24px; }
        .form-input { width:100%; padding:12px 16px; border:1px solid #334155; border-radius:10px; background:#0F172A; color:#F1F5F9; font-size:14px; margin-bottom:12px; }
        .form-input:focus { outline:none; border-color:#D4AF37; }
        .btn-primary { width:100%; padding:14px; background:#D4AF37; color:#111; border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; }
        .btn-primary:hover { background:#C5A028; }
        .btn-primary:disabled { opacity:0.5; }
        .error { color:#EF4444; font-size:13px; margin-bottom:12px; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
        .stat-card .label { color:#94A3B8; font-size:12px; }
        .stat-card .value { color:#F1F5F9; font-size:28px; font-weight:800; margin-top:4px; }
        .stat-card .sub { color:#D4AF37; font-size:12px; margin-top:4px; }
        .pool-bar { background:#334155; height:20px; border-radius:10px; overflow:hidden; margin-top:8px; }
        .pool-fill { height:100%; background:linear-gradient(90deg,#D4AF37,#F59E0B); border-radius:10px; transition:width 0.5s; }
        table { width:100%; border-collapse:collapse; margin-top:16px; }
        th { text-align:left; padding:12px 16px; color:#94A3B8; font-size:12px; font-weight:600; border-bottom:1px solid #334155; text-transform:uppercase; }
        td { padding:12px 16px; border-bottom:1px solid #1E293B; font-size:13px; }
        tr:hover td { background:#1E293B; }
        .badge { display:inline-block; padding:2px 10px; border-radius:8px; font-size:11px; font-weight:600; }
        .badge-active { background:rgba(22,163,74,0.16); color:#22C55E; }
        .badge-suspended { background:rgba(220,38,38,0.16); color:#EF4444; }
        .badge-pending { background:rgba(245,158,11,0.16); color:#FBBF24; }
        .btn-sm { padding:6px 14px; border-radius:8px; border:1px solid #334155; background:transparent; color:#94A3B8; cursor:pointer; font-size:12px; }
        .btn-sm:hover { background:#334155; }
        .btn-gold { background:rgba(212,175,55,0.14); color:#D4AF37; border-color:#D4AF37; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; color:#94A3B8; font-size:12px; margin-bottom:4px; }
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:100; }
        .modal { background:#1E293B; border:1px solid #334155; border-radius:16px; padding:32px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
        .modal h3 { color:#D4AF37; margin-bottom:16px; }
        .invoice-detail { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:16px; margin-top:12px; }
        .section-title { font-size:18px; font-weight:700; margin-bottom:16px; color:#F1F5F9; }
        .empty { text-align:center; padding:40px; color:#64748B; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
    const API = '/api';
    let token = localStorage.getItem('master_token') || '';
    let currentTab = 'dashboard';
    let dashboard = null;
    let jewellers = [];
    let pools = [];
    let invoices = [];
    let transactions = [];
    let showOnboard = false;
    let showInvoice = null;
    let domainFor = null;   // jeweller being edited
    let domainCheck = null; // DNS check result
    let rateInfo = null;

    async function apiFetch(path, opts = {}) {
        const h = {'Content-Type':'application/json'};
        if (token) h['Authorization'] = 'Bearer ' + token;
        const r = await fetch(API + path, {...opts, headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined});
        if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.detail || 'Request failed'); }
        return r.json();
    }

    function inr(n) { return '₹' + (n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

    async function login(u, p) {
        const r = await apiFetch('/master/login', {method:'POST', body:{username:u,password:p}});
        token = r.access_token;
        localStorage.setItem('master_token', token);
        await loadDashboard();
    }

    function logout() {
        token = ''; localStorage.removeItem('master_token');
        render();
    }

    async function loadDashboard() {
        try { rateInfo = await apiFetch('/master/rate'); } catch {}
        try { dashboard = await apiFetch('/master/dashboard'); } catch(e) { if(e.message.includes('401')||e.message.includes('Invalid')) { logout(); return; } }
        render();
    }

    async function loadJewellers() { try { jewellers = await apiFetch('/master/jewellers'); } catch {} render(); }
    async function loadPools() { try { pools = await apiFetch('/master/pool'); } catch {} render(); }
    async function loadInvoices() { try { invoices = await apiFetch('/master/bifurcation-invoices'); } catch {} render(); }
    async function loadTransactions() { try { transactions = await apiFetch('/master/transactions'); } catch {} render(); }

    async function toggleJeweller(id) {
        try { await apiFetch(`/master/jewellers/${id}/toggle`, {method:'POST'}); await loadJewellers(); } catch(e) { alert(e.message); }
    }

    async function onboardJeweller(data) {
        try { await apiFetch('/master/jewellers', {method:'POST', body:data}); showOnboard = false; await loadJewellers(); } catch(e) { alert(e.message); }
    }

    function openDomains(id) { domainFor = jewellers.find(j=>j.id===id); domainCheck = null; render(); }
    async function saveDomains() {
        try {
            const r = await apiFetch(`/master/jewellers/${domainFor.id}/domains`, {method:'PUT', body:{
                domain: document.getElementById('d_app').value, admin_domain: document.getElementById('d_admin').value }});
            domainFor = {...domainFor, ...r};
            await loadJewellers();
            await checkDomains();
        } catch(e) { alert(e.message); }
    }
    async function checkDomains() {
        try { domainCheck = await apiFetch(`/master/jewellers/${domainFor.id}/domain-check`); } catch(e) { alert(e.message); }
        render();
    }

    function switchTab(tab) {
        currentTab = tab;
        if (tab==='jewellers') loadJewellers();
        else if (tab==='pool') { loadPools(); loadInvoices(); }
        else if (tab==='transactions') loadTransactions();
        else loadDashboard();
    }

    function render() {
        const app = document.getElementById('app');
        if (!token) { app.innerHTML = renderLogin(); return; }
        app.innerHTML = renderHeader() + renderNav() + '<div class="content">' + renderContent() + '</div>' + (showOnboard ? renderOnboardModal() : '') + (showInvoice ? renderInvoiceModal() : '') + (domainFor ? renderDomainModal() : '');
        bindEvents();
    }

    function renderLogin() {
        return `<div class="login-wrap"><div class="login-box">
            <h2>🏛️ Vaultra Master Admin</h2>
            <div id="loginError" class="error"></div>
            <input id="lu" class="form-input" placeholder="Username" value="admin">
            <input id="lp" class="form-input" type="password" placeholder="Password" value="admin123">
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div></div>`;
    }

    function renderHeader() {
        return `<div class="header"><h1>🏛️ Vaultra Master Admin</h1><button class="logout" onclick="logout()">Logout</button></div>`;
    }

    function renderNav() {
        const tabs = ['dashboard','jewellers','pool','transactions'];
        return `<div class="nav">${tabs.map(t=>`<button class="${currentTab===t?'active':''}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;
    }

    function renderContent() {
        if (currentTab==='dashboard') return renderDashboard();
        if (currentTab==='jewellers') return renderJewellers();
        if (currentTab==='pool') return renderPool();
        if (currentTab==='transactions') return renderTransactions();
        return '';
    }

    function renderDashboard() {
        if (!dashboard) return '<div class="empty">Loading...</div>';
        const d = dashboard;
        const p = d.pool;
        return `<div class="stats">
            <div class="stat-card"><div class="label">Jewellers</div><div class="value">${d.jewellers}</div></div>
            <div class="stat-card"><div class="label">Customers</div><div class="value">${d.customers}</div></div>
            <div class="stat-card"><div class="label">Total Gold (g)</div><div class="value">${(d.total_grams||0).toFixed(2)}</div></div>
            <div class="stat-card"><div class="label">Total Revenue</div><div class="value">${inr(d.total_revenue)}</div></div>
            <div class="stat-card"><div class="label">Base Gold Rate</div><div class="value">${inr(d.price?.base_rate)}/g</div><div class="sub">Silver: ${inr(d.price?.silver?.base_rate)}/g</div>
                <div class="sub" id="feed-status" style="color:${rateInfo?.feed?.source==='mt5'?'#22C55E':'#FBBF24'}">${rateInfo?.feed ? (rateInfo.feed.source==='mt5' ? `● Live from MT5 (${rateInfo.feed.gold_symbol} / ${rateInfo.feed.silver_symbol})` : `● Indicative rate — MT5 feed ${rateInfo.feed.configured ? 'unreachable' : 'not connected'}`) : ''}</div>
                ${rateInfo?.feed?.error ? `<div class="sub" style="color:#94A3B8;font-size:11px">${rateInfo.feed.error}</div>` : ''}</div>
            <div class="stat-card"><div class="label">Pool Progress</div><div class="value">${(p.current_grams||0).toFixed(2)}g / ${p.threshold}g</div><div class="pool-bar"><div class="pool-fill" style="width:${Math.min(100,p.progress_pct)}%"></div></div><div class="sub">${(p.progress_pct||0).toFixed(1)}% to bulk order</div></div>
        </div>`;
    }

    function renderJewellers() {
        return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="section-title">Jewellers</div><button class="btn-primary" style="width:auto;padding:10px 20px" onclick="showOnboard=true;render()">+ Onboard Jeweller</button></div>
        <table><tr><th>Business</th><th>Owner</th><th>City</th><th>Customers</th><th>Total Gold</th><th>Domains</th><th>Status</th><th>Action</th></tr>
        ${jewellers.map(j=>`<tr><td>${j.business_name}</td><td>${j.owner_name}</td><td>${j.city}</td><td>${j.customer_count}</td><td>${(j.total_grams||0).toFixed(2)}g</td>
        <td style="font-size:12px">${j.domain||'<span style="color:#64748B">—</span>'}${j.admin_domain?`<br><span style="color:#94A3B8">${j.admin_domain}</span>`:''}</td>
        <td><span class="badge badge-${j.status}">${j.status}</span></td>
        <td><button class="btn-sm btn-gold" onclick="openDomains('${j.id}')">Domains</button>
        <button class="btn-sm" onclick="toggleJeweller('${j.id}')">${j.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join('')}
        </table>`;
    }

    function renderPool() {
        return `<div class="section-title">Pool Accumulator</div>
        <table><tr><th>Pool ID</th><th>Total Grams</th><th>Threshold</th><th>Status</th><th>Triggered</th></tr>
        ${pools.map(p=>`<tr><td>${p.id.slice(0,8)}...</td><td>${(p.total_grams||0).toFixed(4)}g</td><td>${p.threshold}g</td>
        <td><span class="badge badge-${p.status==='accumulating'?'active':p.status==='triggered'?'pending':'active'}">${p.status}</span></td>
        <td>${p.triggered_at ? new Date(p.triggered_at).toLocaleString() : '—'}</td></tr>`).join('')}
        </table>
        <div class="section-title" style="margin-top:32px">Bifurcation Invoices</div>
        ${invoices.length===0?'<div class="empty">No invoices yet. Pool needs to reach threshold.</div>':
        `<table><tr><th>Invoice ID</th><th>Total Grams</th><th>Status</th><th>Date</th><th>Action</th></tr>
        ${invoices.map(i=>`<tr><td>${i.id.slice(0,8)}...</td><td>${(i.total_grams||0).toFixed(4)}g</td>
        <td><span class="badge badge-active">${i.status}</span></td>
        <td>${new Date(i.created_at).toLocaleString()}</td>
        <td><button class="btn-sm btn-gold" onclick="showInvoice=${JSON.stringify(i).replace(/"/g,'&quot;')};render()">View</button></td></tr>`).join('')}
        </table>`}`;
    }

    function renderTransactions() {
        return `<div class="section-title">All Transactions</div>
        <table><tr><th>Invoice</th><th>Type</th><th>Grams</th><th>Amount</th><th>Status</th><th>Date</th></tr>
        ${transactions.map(t=>`<tr><td>${t.invoice_no}</td><td>${t.type}</td><td>${(t.grams||0).toFixed(4)}g</td>
        <td>${inr(t.total)}</td><td><span class="badge badge-active">${t.status}</span></td>
        <td>${new Date(t.created_at).toLocaleDateString()}</td></tr>`).join('')}
        </table>`;
    }

    function renderOnboardModal() {
        return `<div class="modal-overlay" onclick="if(event.target===this){showOnboard=false;render()}"><div class="modal">
        <h3>Onboard New Jeweller</h3>
        <div class="form-grid">
            <div class="form-group"><label>Business Name *</label><input id="ob_biz" class="form-input" placeholder="Sharma Gold & Jewellers"></div>
            <div class="form-group"><label>Owner Name *</label><input id="ob_owner" class="form-input" placeholder="Rajesh Sharma"></div>
            <div class="form-group"><label>Phone *</label><input id="ob_phone" class="form-input" placeholder="9999000003"></div>
            <div class="form-group"><label>Email *</label><input id="ob_email" class="form-input" placeholder="new@vaultra.in"></div>
            <div class="form-group"><label>Password *</label><input id="ob_pass" class="form-input" type="password" placeholder="jeweller123"></div>
            <div class="form-group"><label>City</label><input id="ob_city" class="form-input" placeholder="Delhi"></div>
            <div class="form-group"><label>State</label><input id="ob_state" class="form-input" placeholder="Delhi"></div>
            <div class="form-group"><label>Pincode</label><input id="ob_pin" class="form-input" placeholder="110001"></div>
            <div class="form-group"><label>Address</label><input id="ob_addr" class="form-input" placeholder="Shop address"></div>
            <div class="form-group"><label>PAN</label><input id="ob_pan" class="form-input" placeholder="ABCDE1234F"></div>
            <div class="form-group"><label>Min Redemption (g)</label><input id="ob_min" class="form-input" type="number" value="1" step="0.1"></div>
            <div class="form-group"><label>App Domain (optional)</label><input id="ob_domain" class="form-input" placeholder="gold.yourstore.in"></div>
            <div class="form-group"><label>Primary Color</label><input id="ob_color" class="form-input" type="color" value="#D4AF37"></div>
        </div>
        <div style="display:flex;gap:12px;margin-top:16px">
            <button class="btn-primary" style="flex:1" onclick="handleOnboard()">Create Jeweller</button>
            <button class="btn-sm" style="flex:0.5" onclick="showOnboard=false;render()">Cancel</button>
        </div></div></div>`;
    }

    function renderInvoiceModal() {
        const i = typeof showInvoice === 'string' ? JSON.parse(showInvoice) : showInvoice;
        if (!i) return '';
        return `<div class="modal-overlay" onclick="if(event.target===this){showInvoice=null;render()}"><div class="modal">
        <h3>Bifurcation Invoice</h3>
        <div class="invoice-detail">
            <p><strong>Total Grams:</strong> ${(i.total_grams||0).toFixed(4)}g</p>
            <p><strong>Status:</strong> ${i.status}</p>
            <p><strong>Date:</strong> ${new Date(i.created_at).toLocaleString()}</p>
        </div>
        <table style="margin-top:16px"><tr><th>Jeweller</th><th>Customer</th><th>Grams</th></tr>
        ${(i.details||[]).map(d=>`<tr><td>${d.jeweller_name}</td><td>${d.customer_name}</td><td>${(d.grams||0).toFixed(4)}g</td></tr>`).join('')}
        </table>
        <button class="btn-sm" style="margin-top:16px" onclick="showInvoice=null;render()">Close</button>
        </div></div>`;
    }

    function renderDomainModal() {
        const j = domainFor, c = domainCheck;
        const target = c?.cname_target || location.hostname;
        return `<div class="modal-overlay" onclick="if(event.target===this){domainFor=null;render()}"><div class="modal">
        <h3>Custom Domains · ${j.business_name}</h3>
        <div class="form-group"><label>Customer app domain</label><input id="d_app" class="form-input" placeholder="gold.sharmajewellers.in" value="${j.domain||''}"></div>
        <div class="form-group"><label>Admin panel domain</label><input id="d_admin" class="form-input" placeholder="admin.sharmajewellers.in" value="${j.admin_domain||''}"></div>
        <div class="invoice-detail" style="font-size:13px;line-height:1.6">
            <strong style="color:#D4AF37">DNS setup for the jeweller</strong><br>
            At their domain provider, add a <strong>CNAME</strong> record for each domain pointing to:<br>
            <code style="color:#F1F5F9">${target}</code><br>
            Then add the same domains under <em>Custom Domains</em> in your deployment settings so HTTPS is issued.
        </div>
        ${c ? `<table style="margin-top:12px"><tr><th>Domain</th><th>Resolves to</th><th>Status</th></tr>
            ${c.domains.length===0?'<tr><td colspan=3 class="empty">No domains set</td></tr>':c.domains.map(d=>`<tr><td>${d.domain} <span style="color:#64748B">(${d.kind})</span></td><td>${d.resolves_to.join(', ')||'—'}</td>
            <td><span class="badge ${d.points_here?'badge-active':'badge-pending'}">${d.points_here?'Connected':'DNS pending'}</span></td></tr>`).join('')}</table>` : ''}
        <div style="display:flex;gap:12px;margin-top:16px">
            <button id="save-domains" class="btn-primary" style="flex:1" onclick="saveDomains()">Save & Check DNS</button>
            <button class="btn-sm" onclick="checkDomains()">Re-check</button>
            <button class="btn-sm" onclick="domainFor=null;render()">Close</button>
        </div></div></div>`;
    }

    function bindEvents() {}

    window.handleLogin = async function() {
        const u = document.getElementById('lu')?.value;
        const p = document.getElementById('lp')?.value;
        try { await login(u, p); } catch(e) {
            const el = document.getElementById('loginError');
            if (el) el.textContent = e.message;
        }
    };

    window.handleOnboard = async function() {
        const data = {
            business_name: document.getElementById('ob_biz')?.value || '',
            owner_name: document.getElementById('ob_owner')?.value || '',
            phone: document.getElementById('ob_phone')?.value || '',
            email: document.getElementById('ob_email')?.value || '',
            password: document.getElementById('ob_pass')?.value || '',
            city: document.getElementById('ob_city')?.value || '',
            state: document.getElementById('ob_state')?.value || '',
            pincode: document.getElementById('ob_pin')?.value || '',
            address: document.getElementById('ob_addr')?.value || '',
            pan: document.getElementById('ob_pan')?.value || '',
            min_redemption_grams: parseFloat(document.getElementById('ob_min')?.value || '1'),
            primary_color: document.getElementById('ob_color')?.value || '#D4AF37',
            domain: document.getElementById('ob_domain')?.value || '',
        };
        await onboardJeweller(data);
    };

    // Init
    if (token) loadDashboard();
    else render();
    </script>
</body>
</html>
